# ==============================
# AMASA scaler monitor config
# ==============================
#
# This file is sourced by:
#   make_root_daily.sh
#   publish_daily.sh
#
# Keep paths and commands here, not hard-coded in each script.
#

# ------------------------------
# Common paths
# ------------------------------

BASE_DIR="/home/asuke/amasa_monitor"

FIGURE_DIR="${BASE_DIR}/figure"
LOG_DIR="${BASE_DIR}/logs"

LATEST_JSON="${FIGURE_DIR}/latest.json"


# ------------------------------
# Data source
# Used by make_root_daily.sh on icrhome04
# ------------------------------

DATA_ROOT="/disk/alpaca/data/Akeno-MiniArray/data"


# ------------------------------
# ROOT command
# Used by make_root_daily.sh on icrhome04
#
# Do not rely on PATH in cron.
# Cron environment may only have /usr/bin:/bin.
# ------------------------------

ROOT_CMD="/usr/local/gcc485/ROOT/6.08.06/bin/root"


# ------------------------------
# Public web directory
# Used by publish_daily.sh on icrapp1
# ------------------------------

PUBLIC_BASE="/wwwhome/asuke/public_html/amasa"
PUBLIC_FIGURE_DIR="${PUBLIC_BASE}/figure"
PUBLIC_LATEST_JSON="${PUBLIC_BASE}/latest.json"


# ------------------------------
# Lock files
# ------------------------------

MAKE_LOCK_FILE="/tmp/amasa_make_root_daily.lock"
PUBLISH_LOCK_FILE="/tmp/amasa_publish_daily.lock"


# ------------------------------
# Log files
# ------------------------------

MAKE_LOG_FILE="${LOG_DIR}/make_root_daily.log"
PUBLISH_LOG_FILE="${LOG_DIR}/publish_daily.log"


# ------------------------------
# Plotly JSON output
# Used by make_plotly_json_daily.sh
# ------------------------------

PLOTLY_JSON_DIR_NAME="json"

LATEST_PLOTLY_JSON="${FIGURE_DIR}/latest_plotly.json"

MAKE_PLOTLY_LOG_FILE="${LOG_DIR}/make_plotly_json_daily.log"
MAKE_PLOTLY_LOCK_FILE="/tmp/amasa_make_plotly_json_daily.lock"


# ------------------------------
# Plotly view policy
# Written into latest_plotly.json
# Used by index_plotly.html
# ------------------------------

PLOTLY_DEFAULT_RANGE="last1d"
PLOTLY_DEFAULT_BIN="auto"
PLOTLY_DEFAULT_LAYOUT="split_by_group"

PLOTLY_TARGET_TOTAL_POINTS=20000
PLOTLY_MIN_POINTS_PER_TRACE=300
PLOTLY_MAX_POINTS_PER_TRACE=3000
PLOTLY_HARD_LIMIT_POINTS=50000

# Candidate bins in seconds:
#   10s, 1min, 5min, 10min, 20min, 30min, 1h
PLOTLY_CANDIDATE_BINS_SEC="10 60 300 600 1200 1800 3600"


# ------------------------------
# Plotly datasets to generate
# ------------------------------
#
# last1d_10sec:
#   Fine data for detailed last-1-day monitoring.
#
# last7d_1min:
#   Medium data for last 3d / last 7d views.
#
# last1m_5min:
#   Coarse data for last 2w / last 1m / manual view within recent month.
#

PLOTLY_DATASET_LAST1D_DURATION_SEC=86400
PLOTLY_DATASET_LAST1D_BASE_BIN_SEC=10

PLOTLY_DATASET_LAST7D_DURATION_SEC=604800
PLOTLY_DATASET_LAST7D_BASE_BIN_SEC=60

PLOTLY_DATASET_LAST1M_DURATION_SEC=2678400
PLOTLY_DATASET_LAST1M_BASE_BIN_SEC=300